# =============================================================================
# Hermes Agent × Magpie Multi-Model Workflow Configuration (Sanitized Example)
# =============================================================================
# Apply individual settings with `hermes config set <key> <value>` rather than
# hand-editing a live config.yaml.

model:
  default: antigravity/gemini-4-argon
  provider: magpie
  key_env: HERMES_CUSTOM_MAGPIE_API_KEY
  base_url: http://127.0.0.1:3425/v1
  api_mode: chat_completions

agent:
  max_turns: 500
  reasoning_effort: "high"
  service_tier: "normal"

# -----------------------------------------------------------------------------
# Subagent Delegation: 3-Family Fast Rotation Pool + Zero-Cost Fallback
# -----------------------------------------------------------------------------
delegation:
  model: group/work
  provider: magpie
  reasoning_effort: high
  max_iterations: 250
  max_concurrent_children: 5
  independent_completions: true
  prefix_stagger_seconds: 8
  child_timeout_seconds: 1800
  max_summary_chars: 8000
  worktree_isolation: true
  fallback_providers:
    - provider: magpie
      model: workbuddy/deepseek-v4.1-flash
      base_url: http://127.0.0.1:3425/v1
    - provider: magpie
      model: minimax-code/MiniMax-M3.1-Flash
      base_url: http://127.0.0.1:3425/v1
    - provider: magpie
      model: workbuddy/hy4free
      base_url: http://127.0.0.1:3425/v1

# -----------------------------------------------------------------------------
# Terminal & Loop Guardrails: Prevent build timeouts and infinite failure loops
# -----------------------------------------------------------------------------
terminal:
  timeout: 600

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# -----------------------------------------------------------------------------
# Auxiliary Consumers: Quota-Isolated Compression, Vision, Title & Review
# -----------------------------------------------------------------------------
auxiliary:
  review:
    provider: magpie
    model: codex/gpt-6.1-sol
    base_url: http://127.0.0.1:3425/v1
  background_review:
    enabled: true
    provider: magpie
    model: codex/gpt-6.1-sol
    reasoning_effort: high
    base_url: http://127.0.0.1:3425/v1
  compression:
    provider: magpie
    model: minimax-code/MiniMax-M3.1-Flash
    base_url: http://127.0.0.1:3425/v1
  vision:
    provider: magpie
    model: antigravity/gemini-3.8-flash
    base_url: http://127.0.0.1:3425/v1
  title_generation:
    enabled: true
    provider: magpie
    model: antigravity/gemini-3.8-flash
    base_url: http://127.0.0.1:3425/v1

