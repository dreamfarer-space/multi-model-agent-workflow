<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Multi-Model Agent Workflow — Google Antigravity Plugin</title>
  <desc id="hero-desc">Hero banner for Multi-Model Agent Workflow: Native Google Antigravity plugin with 5-stage gated PR pipeline, isolated subagents, Neon High advisor and blind review, and 33 curated engineering skills.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="960" height="250" rx="16" fill="url(#bgGrad)"/>
  <rect width="960" height="250" rx="16" fill="url(#grid)" opacity="0.65"/>
  <rect x="1" y="1" width="958" height="248" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top eyebrow pill -->
  <rect x="48" y="34" width="338" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="64" cy="47" r="4" fill="#34d399"/>
  <text x="76" y="51" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">ANTIGRAVITY PLUGIN · STAGE 0–4 GATES</text>

  <!-- Main Title -->
  <text x="48" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Multi-Model Agent Workflow</text>
  <rect x="48" y="118" width="180" height="3.5" rx="2" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="48" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#cbd5e1">Antigravity 原生多模型工程流：Hydrogen 主脑统筹、只读 Scout 勘察、Neon High 顾问与盲审、Opus 急救。</text>
  <text x="48" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">内置 33 个工程 Skill + 原生 rules/AGENTS.md + 物理剥离写权限的 scout / advisor / reviewer 代理。</text>

  <!-- Bottom Model Pills -->
  <g transform="translate(48, 196)">
    <rect x="0" y="0" width="182" height="28" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="12" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#93c5fd">Lead: Gemini 4 Hydrogen</text>

    <rect x="190" y="0" width="176" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="202" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fcd34d">Adv/Audit: Neon (High)</text>

    <rect x="374" y="0" width="182" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="386" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#6ee7b7">Scout: research / scout</text>

    <rect x="564" y="0" width="168" height="28" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="576" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">Work: self / workflow</text>

    <rect x="740" y="0" width="134" height="28" rx="6" fill="#31102f" stroke="#c084fc" stroke-width="1.2"/>
    <text x="752" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#e9d5ff">Rescue: Opus 5.5</text>
  </g>
</svg>
