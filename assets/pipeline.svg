<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Five-Stage Engineering Pipeline and Guardrails</title>
  <desc id="pipe-desc">Five sequential stages: 1. Recon and Grill-Me Gate, 2. Single-Writer Execution, 3. Three-Layer Verification, 4. Simplify and Blind Review, 5. Lint-as-Memory and LLM Wiki.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .stage { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    .stage-gate { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.75; rx: 8; }
    .stage-verify { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.75; rx: 8; }
    .stage-review { fill: #fffbeb; stroke: #d97706; stroke-width: 1.75; rx: 8; }
    .num { font: 700 12px "SFMono-Regular", Consolas, monospace; fill: #1e293b; }
    .title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
    .item { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334155; }
    .skill { font: 600 11px "SFMono-Regular", Consolas, monospace; fill: #2563eb; }
    .arrow { stroke: #64748b; stroke-width: 1.75; fill: none; }
    .reset { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .reset-text { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #dc2626; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="300" rx="12"/>

  <!-- Stage 1 -->
  <rect x="20" y="28" width="172" height="210" class="stage-gate"/>
  <text x="32" y="50" class="num">STAGE 1</text>
  <text x="32" y="70" class="title">Recon &amp; Hard Gate</text>
  <text x="32" y="96" class="item">• 3–5 read-only workers</text>
  <text x="32" y="114" class="item">  return ≤50 lines each</text>
  <text x="32" y="136" class="item">• Resolve design tree</text>
  <text x="32" y="154" class="item">• Lock Out-of-Scope files</text>
  <text x="32" y="196" class="skill">grill-me</text>
  <text x="32" y="214" class="skill">improve-architecture</text>

  <path d="M 192 133 L 208 133" class="arrow" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="210" y="28" width="172" height="210" class="stage"/>
  <text x="222" y="50" class="num">STAGE 2</text>
  <text x="222" y="70" class="title">Focused Execution</text>
  <text x="222" y="96" class="item">• 1 writer for coupled UI</text>
  <text x="222" y="114" class="item">• 1 worker for all locales</text>
  <text x="222" y="136" class="item">• Theme tokens &amp; // WHY:</text>
  <text x="222" y="154" class="item">• Discriminated unions</text>
  <text x="222" y="196" class="skill">typescript-best-prac</text>
  <text x="222" y="214" class="skill">animate-expo / swift</text>

  <path d="M 382 133 L 398 133" class="arrow" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="400" y="28" width="172" height="210" class="stage-verify"/>
  <text x="412" y="50" class="num">STAGE 3</text>
  <text x="412" y="70" class="title">3-Layer Verification</text>
  <text x="412" y="96" class="item">1. Headless / TLA+ chart</text>
  <text x="412" y="114" class="item">2. check + test + blast</text>
  <text x="412" y="136" class="item">3. break-ui dirty data +</text>
  <text x="412" y="154" class="item">   bounds → screenshot</text>
  <text x="412" y="196" class="skill">statechart / break-ui</text>
  <text x="412" y="214" class="skill">blast-radius</text>

  <path d="M 572 133 L 588 133" class="arrow" marker-end="url(#arr)"/>

  <!-- Stage 4 -->
  <rect x="590" y="28" width="172" height="210" class="stage-review"/>
  <text x="602" y="50" class="num">STAGE 4</text>
  <text x="602" y="70" class="title">2-Stage Blind Review</text>
  <text x="602" y="96" class="item">• 4-way code cleanup</text>
  <text x="602" y="114" class="item">• GPT-6.1-Sol reads diff:</text>
  <text x="602" y="136" class="item">  1) Missing / Extra</text>
  <text x="602" y="154" class="item">  2) Race &amp; lock safety</text>
  <text x="602" y="196" class="skill">simplify-code</text>
  <text x="602" y="214" class="skill">benchmark-checklist</text>

  <path d="M 762 133 L 778 133" class="arrow" marker-end="url(#arr)"/>

  <!-- Stage 5 -->
  <rect x="780" y="28" width="160" height="210" class="stage"/>
  <text x="792" y="50" class="num">STAGE 5</text>
  <text x="792" y="70" class="title">Compounding</text>
  <text x="792" y="96" class="item">• Turn bug class into a</text>
  <text x="792" y="114" class="item">  static check rule</text>
  <text x="792" y="136" class="item">• Update wiki index.md</text>
  <text x="792" y="154" class="item">  for next session</text>
  <text x="792" y="196" class="skill">rigorous-dev</text>
  <text x="792" y="214" class="skill">llm-wiki / humanizer</text>

  <!-- Two-strike reset feedback loop -->
  <path d="M 486 238 L 486 268 L 106 268 L 106 242" class="reset" marker-end="url(#arr-red)"/>
  <text x="215" y="286" class="reset-text">Two-Strike Reset Rule: 2 failed fix attempts → stop patching, record falsified hypothesis, re-plan</text>
</svg>
